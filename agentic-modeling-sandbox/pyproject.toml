[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-modeling-sandbox"
version = "0.9.0"
description = "LLM-free environment and control plane for agent-built modeling programs"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.scripts]
ams = "ams.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ams"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
